<!doctype html>
<meta charset="utf-8">
<title>B31.3 live Preview build acceptance</title>
<main id="fixture"></main>
<pre id="result">RUNNING</pre>
<script type="module">
import {
  xmlCiiBuildAndRenderPreview,
  xmlCiiRenderPreviewPhase,
} from '../../tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-preview-renderer-v7.js';
import {
  installPreviewB313WallUpdateAuditController,
  renderPreviewB313WallAuditHtml,
  bindPreviewB313ConditionalManufacturing,
  renderPreviewB313CalculatedWallCells,
  buildPreviewB313AutomaticWallColumnReport,
} from '../../tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-preview-b313-wall-audit-controller.js';
import { buildPreviewB313ScreeningReference,buildPreviewB313CalculatedWallDisplay } from '../../tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-preview-b313-wall-update.js';
import { installPreviewB313AutoBasisPanel } from '../../tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-preview-b313-auto-basis.js';
import { b313PreviewInputSignature, b313PreviewNodeSignature } from '../../converters/xml-cii2019-core/b313-preview-pull-authority.js';
import { applyStandaloneProcessParity } from '../../tabs/xml-cii-2019-standalone/xml-cii-standalone-run-parity.js';

const done = (result) => {
  globalThis.__B313_LIVE_PREVIEW_RESULT__ = result;
  document.querySelector('#result').textContent = JSON.stringify(result, null, 2);
};
const waitFor = async (check, label) => {
  for (let attempt = 0; attempt < 200; attempt += 1) {
    if (check()) return;
    await new Promise((resolve) => setTimeout(resolve, 25));
  }
  throw new Error(`Timed out waiting for ${label}`);
};
const assert = (condition, message) => {
  if (!condition) throw new Error(message);
};

try {
  localStorage.clear();
  const xmlText = await fetch('../../Benchmarks/EF-05-PRO.TEST.xml').then((response) => {
    if (!response.ok) throw new Error(`Fixture HTTP ${response.status}`);
    return response.text();
  });
  const config = {
    linelist: { masterRows: [] },
    pipingClass: { masterRows: [{ pipingClass: '31441C4', material: 'ASTM A106-B' }] },
    overrides: {},
  };
  const card = document.querySelector('#fixture');
  card.innerHTML = xmlCiiRenderPreviewPhase(new File([xmlText], 'EF-05-PRO.TEST.xml'), config);
  const host = card.querySelector('#mc-preview-table-host');
  assert(host, 'Preview host was not created');
  const initial = await xmlCiiBuildAndRenderPreview(card, xmlText, config, {});
  assert(initial.branchRows.length === 0, 'Expected manual idle Preview before Build');
  installPreviewB313WallUpdateAuditController({ host, config, xmlText, rows: initial.branchRows });
  queueMicrotask(() => installPreviewB313AutoBasisPanel({ host, config, rows: initial.branchRows }));
  await new Promise((resolve) => setTimeout(resolve, 0));
  assert(!host.querySelector('[data-mc-b313-auto-basis-panel]'), 'Auto panel rendered before Build');

  host.querySelector('[data-mc-preview-build]').click();
  await waitFor(() => host.__xmlCiiPreviewResult?.branchRows?.length === 41, '41 live Preview branch rows');
  await waitFor(() => host.querySelector('[data-mc-b313-auto-basis-panel]'), 'auto-basis panel after Build');

  const liveBranchTable=host.querySelector('table[data-resizable-table="branch-preview"]');
  assert(liveBranchTable,'No effective physical 4 Preview table found');
  const headerElements=[...liveBranchTable.querySelectorAll('thead th')];
  const requiredHeader=headerElements.find(h=>h.dataset.colId==='b313CalculatedWall');
  const currentHeaders=headerElements
    .map(x=>(x.dataset.colId||'?')+'='+x.textContent.trim().slice(0,38));
  assert(requiredHeader?.textContent.includes('B31.3 Required (mm)'),
    'Required nominal wall must be its own visible 4 Preview column. Headers: '+currentHeaders.join(' | '));
  assert(liveBranchTable.querySelectorAll('[data-mc-b313-calculated-row]').length===41,
    'Calculated wall column must exist for all physical Preview rows');
  assert(headerElements.some(h=>h.dataset.colId==='wallThickness'),
    'Existing editable Wall Thk column was replaced instead of preserved');
  await waitFor(()=>[...liveBranchTable.querySelectorAll('[data-mc-b313-calculated-row]')]
    .every(cell=>cell.dataset.mcB313CalculatedStatus),
    'automatic physical 4 Preview calculated-wall column before clicking Calculate');
  assert(!host.querySelector('[data-mc-b313-report]'),
    'Auto-calculating display column must not execute governed audit/Pull button');
  assert([...liveBranchTable.querySelectorAll('[data-mc-b313-calculated-row]')]
    .some(cell=>cell.dataset.mcB313CalculatedStatus==='INPUT_REQUIRED'),
    'Rows lacking real P1/T1 must retain a visible incomplete-input status');
  const legacy = host.querySelector('[data-mc-b313-basis-editor]');
  assert(!legacy || legacy.hidden || legacy.style.display === 'none', 'Legacy B31.3 editor is visible');
  const panel = host.querySelector('[data-mc-b313-auto-basis-panel]');
  assert(panel.getClientRects().length > 0, 'Auto-basis panel is not visibly rendered');
  // Unified B31.3 review keeps the same per-occurrence editor and full
  // physical-row audit within ONE panel; no wall is changed by Calculate.
  const unifiedSlot = panel.querySelector('[data-mc-b313-unified-audit-slot]');
  assert(unifiedSlot, 'Unified B31.3 audit slot missing from the basis panel');
  assert(host.querySelector('[data-mc-wall-review]'), 'DTXR and B31.3 do not share a Wall Thickness Review workspace');
  const existingOverrideReceipt = JSON.stringify(config.overrides || {});
  const dtxrReviewAction = host.querySelector('[data-mc-dtxr-wall-update]');
  assert(dtxrReviewAction, 'DTXR candidate review action missing');
  dtxrReviewAction.click();
  const dtxrReviewSlot = panel.querySelector('[data-mc-dtxr-unified-review-slot]');
  assert(dtxrReviewSlot?.querySelector('[data-mc-dtxr-review-results]'),
    'DTXR source proposals were not rendered alongside B31.3');
  assert(JSON.stringify(config.overrides || {}) === existingOverrideReceipt,
    'Merely reviewing DTXR candidates mutated saved wall overrides');
  const liveWallButton = host.querySelector('[data-mc-b313-wall-update]');
  assert(liveWallButton, 'Existing governed B31.3 calculate action missing');
  liveWallButton.click();
  await waitFor(() => unifiedSlot.querySelector('[data-mc-b313-report]'),
    'Unified B31.3 audit after source build and calculation');
  const audit = unifiedSlot.querySelector('[data-mc-b313-report]');
  assert(audit.textContent.includes('Evaluated 41'), 'Audit did not use 41 physical Preview rows');
  assert(audit.querySelector('th') && audit.textContent.includes('Calculated required (mm)'),
    'Calculated millimetres must also appear as an audit table column');
  const liveCalcCells=liveBranchTable.querySelectorAll('[data-mc-b313-calculated-row]');
  assert(liveCalcCells.length===41 && [...liveCalcCells].every(e=>e.dataset.mcB313CalculatedStatus),
    'Calculate did not refresh all 41 physical row wall cells');

  const csvButton=audit.querySelector('[data-b313-evidence-download="csv"]');
  const jsonButton=audit.querySelector('[data-b313-evidence-download="json"]');
  assert(csvButton&&jsonButton, 'Source-to-wall CSV/JSON evidence controls unavailable');
  assert(csvButton.textContent.includes('41 rows'),
    'Full live Preview occurrence population is not exported');
  const evidenceBlobs=[],evidenceNames=[];
  const nativeObjectUrl=URL.createObjectURL;
  const nativeRevokeUrl=URL.revokeObjectURL;
  const nativeAnchorClick=HTMLAnchorElement.prototype.click;
  try {
    URL.createObjectURL=blob=>{evidenceBlobs.push(blob);return 'blob:test/4preview-source-proof';};
    URL.revokeObjectURL=()=>{};
    HTMLAnchorElement.prototype.click=function(){evidenceNames.push(this.download);};
    csvButton.click();
    jsonButton.click();
  } finally {
    URL.createObjectURL=nativeObjectUrl;
    URL.revokeObjectURL=nativeRevokeUrl;
    HTMLAnchorElement.prototype.click=nativeAnchorClick;
  }
  assert(evidenceBlobs.length===2,'Both evidence downloads must produce browser Blob data');
  assert(evidenceNames[0]==='GLRD-4Preview-B313-Source-to-Wall.csv');
  assert(evidenceNames[1]==='GLRD-4Preview-B313-Source-to-Wall.json');
  const proofJson=JSON.parse(await evidenceBlobs[1].text());
  assert(proofJson.schema==='b313-preview-source-to-wall-ledger/v1');
  assert(proofJson.rows.length===41,'Exporter omitted physical Preview rows');
  assert(proofJson.rows.every((r,i)=>r.ordinal===i+1),'Physical ordinal order changed');
  assert(proofJson.rows.every(r=>!r.pullEligible),'Screening cannot set Pull eligibility');
  const proofCsv=await evidenceBlobs[0].text();
  assert(proofCsv.split('\r\n').filter(Boolean).length===42,
    'Exporter CSV does not have 41 source-ordered physical rows plus header');

  assert(host.querySelectorAll('[data-mc-b313-report]').length === 1,
    'Competing top-level and unified B31.3 audit panels were rendered');
  assert(audit.textContent.includes('Held 41'),
    'Unqualified source inputs must remain not updated');
  assert(!Object.keys(config.b313WallUpdate?.acceptedWallByBranch || {}).length,
    'Calculation must never create accepted Pull walls');
  // Browser-level independent screening witness. Use a GLRD-shaped
  // physical row with explicit TEST-ONLY pressure units/OD, not the real
  // EF05 engineering basis. No Pull state or Preview wall may be modified.
  const conditionalRow = {
    branchName:'/GLRD-1000-4"-P4110001-93833-01/B6', lineKey:'P4110001',
    sizeMm:150,pipingClass:'93833',material:'DSS',
    materialSource:'process-linelist-material',t1:'120',t1Source:'linelist',
    p1:'13001',p1Unit:'KPA',p1Source:'linelist',corrosion:'0',
    pipingClassPipeDnMm:150,pipingClassPipeSourceRow:93833,
    pipingClassPipeSchedule:'40S',pipingClassPipeWallMm:7.112,
    pipingClassPipeMaterial:'ASTM A790 UNS S31803',
  };

  // The new independent table column must print actual computed millimetres
  // for a GLRD-shaped Preview row even if approved Pull remains unavailable.
  const candidateWithUnit={...conditionalRow,p1Unit:''};
  const candidateConfig={b313WallUpdate:{bases:{},proposalsByBranch:{},acceptedWallByBranch:{}}};
  const wallBefore=JSON.stringify(candidateConfig);
  const displayResult=buildPreviewB313CalculatedWallDisplay({
    row:candidateWithUnit,config:candidateConfig,previewNodeRows:[],rowIndex:0});
  assert(displayResult.ok&&displayResult.pressureUnitAssumed,
    'An explicitly identified assumed-kPa what-if must compute numerical wall');
  const independentTableHost=document.createElement('section');
  independentTableHost.innerHTML='<table data-resizable-table="branch-preview"><tbody><tr class="mc-preview-row">'
    +'<td><span data-test-preserved-wall>7.112</span></td>'
    +'<td data-mc-b313-calculated-row="0"><strong data-mc-b313-calculated-value>—</strong>'
    +'<small data-mc-b313-calculated-detail>Calculate</small></td></tr></tbody></table>';
  card.appendChild(independentTableHost);

  // Full controller integration: a newly built, source-complete Preview
  // fills its numerical column WITHOUT ever clicking the Calculate button.
  const builtPreviewHost=document.createElement('section');
  builtPreviewHost.innerHTML='<button type="button" data-mc-b313-wall-update>Calculate</button>'
    +'<table data-resizable-table="branch-preview"><tbody><tr class="mc-preview-row">'
    +'<td><span data-test-preserved-wall>7.112</span></td>'
    +'<td data-mc-b313-calculated-row="0"><strong data-mc-b313-calculated-value>—</strong>'
    +'<small data-mc-b313-calculated-detail>Calculate</small></td></tr></tbody></table>';
  builtPreviewHost.__xmlCiiPreviewResult={
    branchRows:[candidateWithUnit],nodeBoreWallRows:[]};
  card.appendChild(builtPreviewHost);
  let autoButtonClicks=0;
  builtPreviewHost.querySelector('[data-mc-b313-wall-update]')
    .addEventListener('click',()=>{autoButtonClicks++;});
  installPreviewB313WallUpdateAuditController({
    host:builtPreviewHost,config:candidateConfig,rows:[candidateWithUnit],
  });
  await waitFor(()=>builtPreviewHost.querySelector('[data-mc-b313-calculated-value]')
    ?.textContent==='5.983','automatically populated GLRD numerical wall on Preview build');
  assert(autoButtonClicks===0,'Numerical auto-display must not click governed Calculate');
  assert(!builtPreviewHost.querySelector('[data-mc-b313-report]'),
    'Numerical auto-display must not open or run approval audit');
  assert(candidateConfig.b313WallUpdate.bases
      && !Object.keys(candidateConfig.b313WallUpdate.bases).length,
    'Auto column must not persist manual factors or pressure-unit assumptions');
  builtPreviewHost.dataset.mcB313PreviewDirty='true';
  await waitFor(()=>builtPreviewHost.querySelector('[data-mc-b313-calculated-value]')
    ?.textContent==='—','edited Preview invalidates displayed B31.3 required wall');
  assert(builtPreviewHost.querySelector('[data-mc-b313-calculated-detail]')
    .textContent==='Rebuild Preview');
  builtPreviewHost.__xmlCiiPreviewResult={branchRows:[candidateWithUnit],
    nodeBoreWallRows:[]};
  builtPreviewHost.dataset.mcB313PreviewDirty='false';
  await waitFor(()=>builtPreviewHost.querySelector('[data-mc-b313-calculated-value]')
    ?.textContent==='5.983','rebuild recomputes display-only B31.3 wall');
  assert(autoButtonClicks===0);
  builtPreviewHost.__xmlCiiB313WallAuditObserver?.disconnect?.();
  builtPreviewHost.remove();

  const updated=renderPreviewB313CalculatedWallCells(independentTableHost,{
    rows:[{status:'NOT_UPDATED',calculatedWallDisplay:displayResult}]});
  assert(updated.calculatedRows===1&&updated.assumedPressureUnitRows===1,
    'Read-only Preview calculated-wall cell did not receive numerical reference');
  const calcCell=independentTableHost.querySelector('[data-mc-b313-calculated-row="0"]');
  assert(calcCell.querySelector('[data-mc-b313-calculated-value]').textContent==='5.983',
    'Required nominal wall must appear as 5.983 mm next to Wall Thk');
  assert(calcCell.querySelector('[data-mc-b313-calculated-detail]').textContent.includes('Assumed kPa'),
    'Hypothetical pressure unit must be visible without opening a tooltip');
  assert(calcCell.title.includes('Source')||calcCell.title.includes('Evidence'),
    'Displayed wall must have independent source and interpolation proof');
  assert(independentTableHost.querySelector('[data-test-preserved-wall]').textContent==='7.112',
    'Calculated column changed saved editable Wall Thk');
  assert(JSON.stringify(candidateConfig)===wallBefore,
    'New table column calculation must not mutate config or Pull');
  independentTableHost.remove();

  // Browser-visible 4 Preview proof: immediately show S/E/W/Y numbers
  // from the master, before any pressure unit, factor approval or Calculate.
  const screenHost=document.createElement('section');
  screenHost.innerHTML='<button type="button" data-mc-b313-wall-update>Calculate</button><details data-mc-b313-basis-editor></details>';
  card.appendChild(screenHost);
  const screeningOnlyRow={...conditionalRow,p1Unit:''};
  const screenConfig={b313WallUpdate:{bases:{},proposalsByBranch:{},acceptedWallByBranch:{}}};
  let basisSaveCount=0,screeningCalculateClicks=0;
  screenHost.querySelector('[data-mc-b313-wall-update]')
    .addEventListener('click',()=>{screeningCalculateClicks++;});
  installPreviewB313AutoBasisPanel({host:screenHost,config:screenConfig,
    rows:[screeningOnlyRow],watchLive:false,
    options:{onSaveConfigPreservePreview:async()=>{basisSaveCount++;}}});
  const screeningEl=screenHost.querySelector('[data-b313-auto-screening-reference]');
  assert(screeningEl && screeningEl.getClientRects().length>0,
    'Numerical material-master screening reference is not visibly rendered in 4 Preview');
  assert(screeningEl.textContent.includes('S 203.395 MPa'),
    '4 Preview does not display exact DSS master S at T1=120°C');
  assert(screeningEl.textContent.includes('E 1 (conditional Seamless) · W 1 · Y 0.4'),
    'Visible screening E/W/Y values are not resolved');
  const manualS=screenHost.querySelector('[data-b313-auto-field="allowableStress"]');
  const factorInputs=['allowableStress','qualityFactorE','weldStrengthReductionW','coefficientY'];
  const expectedFactorValues=[203.395339,1,1,0.4];
  for(let index=0;index<factorInputs.length;index++){
    const input=screenHost.querySelector('[data-b313-auto-field="'+factorInputs[index]+'"]');
    assert(input && Math.abs(Number(input.value)-expectedFactorValues[index])<0.0001,
      'Visible 4 Preview factor '+factorInputs[index]+' was not automatically populated');
    assert(input.dataset.b313FactorOrigin==='SCREENING_MASTER',
      'Visible factor source is missing its screening qualification');
  }
  assert(screenHost.querySelector('[data-b313-auto-field="stressUnit"]').value==='MPa');
  const qualification=screenHost.querySelector('[data-b313-auto-factor-qualification]');
  const evidence=screenHost.querySelector('[data-b313-auto-evidence]');
  assert(qualification?.dataset.b313Qualification==='SCREENING_NOT_QUALIFIED',
    'Visible qualification must identify unapproved screening source');
  assert(evidence?.textContent.includes('OWNER-B313-SEWY-2026-08-11')
    && evidence?.textContent.includes('2016/2018 user-supplied basis'),
    'Source/master edition evidence is not shown in visible 4 Preview');
  assert(screenHost.querySelector('[data-b313-auto-source-reference]').value.startsWith('SCREENING_ONLY:'),
    'Source reference input should be prepopulated with explicit SCREENING_ONLY evidence');
  assert(!screenHost.querySelector('[data-b313-auto-design-approved]').checked,
    'Screening source must not precheck manual qualification');
  const infoButton=screenHost.querySelector('[data-b313-factor-info-button="S"]');
  infoButton.click();
  const info=screenHost.querySelector('[data-b313-factor-info="S"]');
  assert(info && !info.hidden && info.textContent.includes('29.5 ksi'),
    'Factor S popup omitted exact temperature lookup and source');
  infoButton.click();
  const unitChoice=screenHost.querySelector('[data-b313-auto-field="pressureUnit"]');
  assert(unitChoice?.value==='AUTO','Missing unit should remain AUTO until user chooses');
  unitChoice.value='KPA';
  unitChoice.dispatchEvent(new Event('change',{bubbles:true}));
  await waitFor(()=>basisSaveCount===1&&screeningCalculateClicks===1,
    'screening-only pressure unit change to recalculate');
  const unitKey=screenHost.querySelector('[data-b313-auto-key]').dataset.b313AutoKey;
  assert(screenConfig.b313WallUpdate.bases[unitKey]?.pressureUnit==='KPA',
    'Chosen 4 Preview B31.3 P unit was not saved by occurrence');
  assert(screenConfig.b313WallUpdate.bases[unitKey]?.designApproved!==true,
    'Selecting a P unit must not approve screening S/E/W/Y');
  const refresh=screenHost.querySelector('[data-b313-auto-refresh]');
  refresh.click();
  assert(screeningCalculateClicks===2,
    'Refresh with auto-filled screening basis should recalculate conditionally');
  assert(screenConfig.b313WallUpdate.bases[unitKey]?.allowableStress===undefined,
    'Screening factors were incorrectly stored as approved manual factor basis');
  const review=screenHost.querySelector('[data-b313-auto-design-approved]');
  review.checked=true;
  refresh.click();
  assert(screeningCalculateClicks===2,
    'Merely checking reviewed must NOT authorize screening evidence');
  assert(screenHost.querySelector('[data-b313-auto-status]').textContent.includes('SCREENING SOURCE IS NOT QUALIFIED'),
    'Unqualified screening approval attempt did not display explicit reason');
  assert(screenConfig.b313WallUpdate.bases[unitKey]?.designApproved!==true,
    'Screening approval checkbox changed saved engineering authority');
  assert(!Object.keys(screenConfig.b313WallUpdate.proposalsByBranch).length,
    'Changing a screening P unit must not create Pull proposals');
  const screenResult=buildPreviewB313ScreeningReference({row:screeningOnlyRow,
    config:screenConfig,previewNodeRows:[],rowIndex:0});
  assert(screenResult.pressureUnit==='KPA' && screenResult.conditionalScenario?.calculationOk,
    'Explicit Preview P unit did not unlock numerical screening wall');
  screenHost.remove();

  const conditionalConfig={b313WallUpdate:{bases:{},proposalsByBranch:{},
    acceptedWallByBranch:{},millTolerance:{basis:'percent',value:12.5}}};
  const conditionalBefore=JSON.stringify(conditionalConfig);
  const conditionalReference=buildPreviewB313ScreeningReference({
    row:conditionalRow,config:conditionalConfig,rowIndex:0,
    previewNodeRows:[{branchOccurrenceIndex:0,nodeOrdinal:0,
      nodeNumber:'100',componentType:'PIPE',outsideDiameterMm:168.3}],
  });
  assert(conditionalReference.ok, 'Master screening reference is unavailable');
  assert(conditionalReference.conditionalManufacturing==='SEAMLESS',
    'Default conditional manufacturing must be Seamless');
  assert(conditionalReference.conditionalE===1,
    'Default conditional seamless E must be 1');
  assert(conditionalReference.eligibleForPull===false,
    'Conditional manufacturing must not authorize Pull');
  const probe=document.createElement('section');
  probe.innerHTML=renderPreviewB313WallAuditHtml({
    summary:{inputRows:1,calculatedRows:0,updatedRows:0,skippedRows:1},
    rows:[{branchName:conditionalRow.branchName,lineKey:conditionalRow.lineKey,
      status:'NOT_UPDATED',code:'SCREENING_TEST_ONLY',
      screeningReference:conditionalReference}],
  });
  card.appendChild(probe);
  bindPreviewB313ConditionalManufacturing(probe);
  const conditionalSelect=probe.querySelector('[data-b313-conditional-manufacturing]');
  const conditionalE=probe.querySelector('[data-b313-conditional-e-value]');
  const seamlessScenario=probe.querySelector('[data-b313-screening-scenario="SEAMLESS"]');
  const weldedScenario=probe.querySelector('[data-b313-screening-scenario="EFW_SINGLE_BUTT"]');
  assert(conditionalSelect?.value==='SEAMLESS', 'UI did not select Seamless');
  assert(conditionalSelect.selectedOptions[0].textContent==='Seamless',
    'Conditional manufacturing default label is not Seamless');
  assert(conditionalE?.textContent==='1',
    'UI did not display E=1 from the master');
  assert(seamlessScenario?.style.display==='' && weldedScenario?.style.display==='none',
    'Default wall scenario is not Seamless-only');
  assert(seamlessScenario?.textContent.includes('5.2448 mm'),
    'Default seamless wall result is not calculated from the master');
  conditionalSelect.value='EFW_SINGLE_BUTT';
  conditionalSelect.dispatchEvent(new Event('change',{bubbles:true}));
  assert(conditionalE.textContent==='0.8', 'Conditional route change did not update E');
  assert(seamlessScenario.style.display==='none' && weldedScenario.style.display==='',
    'Conditional route change did not switch reference wall result');
  assert(JSON.stringify(conditionalConfig)===conditionalBefore,
    'Selecting screening manufacturing route mutated saved engineering config');
  probe.remove();

  // Regression: physical source has no positive outside-diameter node;
  // reference only may use the exact-DN B36.19 dimensional master, while
  // engineering Pull and the physical Preview must remain unchanged.
  const odless=buildPreviewB313ScreeningReference({
    row:conditionalRow,config:conditionalConfig,rowIndex:0,previewNodeRows:[],
  });
  assert(odless.ok && odless.outsideDiameterReferenceOnly,
    'Screening must identify exact-DN dimensional-master OD as assumption');
  assert(odless.outsideDiameterSource==='pipe-wall-master-exact-DN-SCREENING-ONLY',
    'Source of fallback OD is missing from audit receipt');
  assert(odless.conditionalScenario?.calculationOk,
    'Screening wall could not be calculated from exact-DN master OD');
  assert(odless.eligibleForPull===false, 'Master OD should never authorize Pull');
  const fallbackAudit=renderPreviewB313WallAuditHtml({
    summary:{inputRows:1,calculatedRows:0,updatedRows:0,skippedRows:1},
    rows:[{branchName:conditionalRow.branchName,lineKey:'P4110001',
      status:'NOT_UPDATED',code:'REFERENCE_ONLY',screeningReference:odless}],
  });
  assert(fallbackAudit.includes('4 Preview node OD unavailable'),
    'Audit does not disclose the assumed screening dimensional OD');
  assert(fallbackAudit.includes('5.2354 mm'),
    'Master OD fallback did not render conditional calculated wall');
  assert(JSON.stringify(conditionalConfig)===conditionalBefore,
    'Master OD calculation changed persisted engineering basis');

  const rows = host.__xmlCiiPreviewResult.branchRows;
  const a106 = rows.find((row) => String(row.material || '').includes('A106'));
  assert(a106, 'The 41-branch Preview did not resolve A106 material');
  assert(panel.querySelector('[data-b313-auto-status]')?.textContent === 'T1 REQUIRED', 'Blank T1 did not fail closed');
  assert([...panel.querySelectorAll('[data-b313-auto-refresh]')].every((button) => button.disabled), 'Blank T1 enabled fallback acceptance');

  config.overrides.processData = { [a106.lineKey]: { t1: '82' } };
  const previousResult = host.__xmlCiiPreviewResult;
  host.querySelector('[data-mc-preview-build]').click();
  await waitFor(() => host.__xmlCiiPreviewResult !== previousResult
    && host.__xmlCiiPreviewResult?.branchRows?.some((row) => row.lineKey === a106.lineKey && row.t1 === '82'), 'authorized T1 Preview rebuild');
  // The engineering basis is now scoped to the physical Preview occurrence,
  // so T1 is no longer the final component of the persistence key.
  await waitFor(() => host.querySelector('[data-b313-auto-key*="T1=82"]'), 'T1 82 auto-basis row');
  const seedRow = host.querySelector('[data-b313-auto-key*="T1=82"]');
  assert(seedRow.dataset.b313AutoKey.includes('|OCCURRENCE:'),
    'Manual factor approvals must be physically occurrence-scoped');
  const seedPanel = host.querySelector('[data-mc-b313-auto-basis-panel]');
  assert(seedRow.textContent.includes('Seed 120 °C'), 'T1 82 did not show the 120 °C common seed');
  assert(seedRow.querySelectorAll('[data-b313-auto-field]').length >= 7, 'S/unit/E/W/Y and pressure/dimension basis controls are incomplete');
  assert(seedRow.querySelectorAll('[data-b313-factor-info-button]').length === 4, 'Factor provenance controls are incomplete');
  assert(!seedRow.querySelector('[data-b313-auto-refresh]').disabled, 'The manual basis save action is disabled');
  assert(seedRow.querySelector('[data-b313-auto-source-reference]'), 'Qualified manual basis source input is missing');
  assert(seedRow.querySelector('[data-b313-auto-design-approved]'), 'Manual design-basis review control is missing');
  assert(seedPanel.querySelector('[data-b313-mill-basis]') && seedPanel.querySelector('[data-b313-mill-value]'), 'Mill tolerance controls are missing');
  assert(!config.b313WallUpdate?.bases?.[seedRow.dataset.b313AutoKey], 'Showing a seed silently persisted a basis');
  const rebuiltLegacy = host.querySelector('[data-mc-b313-basis-editor]');
  assert(!rebuiltLegacy || rebuiltLegacy.hidden || rebuiltLegacy.style.display === 'none', 'Legacy editor reappeared after rebuild');
  // Synthetic approved proposal exercises the real ⤓ Pull UI and the
  // Worker rebuild/parity path. It does NOT certify any B31.3 factors.
  const nodeLedger = host.__xmlCiiPreviewResult.nodeBoreWallRows;
  assert(Array.isArray(nodeLedger) && nodeLedger.length > 0, 'Worker did not publish the complete Step 4 pipe ledger');
  const effectiveRows = host.__xmlCiiPreviewResult.branchRows;
  const wallApplicableNode = (n) => Number(n.outsideDiameterMm) > 0;
  const targetIndex = effectiveRows.findIndex((row, index) => {
    const pipes = nodeLedger.filter((n) => Number(n.branchOccurrenceIndex) === index && wallApplicableNode(n));
    const odValues = [...new Set(pipes.map((n) => Number(n.outsideDiameterMm)).filter((n) => n > 0))];
    return pipes.length > 0 && odValues.length === 1 && Number(row.wallThickness || 0) >= 0
      && Number(row.wallThickness || 0) + 1 < odValues[0] * 0.35;
  });
  assert(targetIndex >= 0, 'No unambiguous valid pipe occurrence is available for synthetic Pull wiring test');
  const sourceRow = effectiveRows[targetIndex];
  const branchLedger = nodeLedger.filter((n) => Number(n.branchOccurrenceIndex) === targetIndex);
  const pipeLedger = branchLedger.filter(wallApplicableNode);
  const currentWall = Number(sourceRow.wallThickness || 0);
  const proposedWall = Number((currentWall + 1).toFixed(4));
  const basis = config.b313WallUpdate || (config.b313WallUpdate = {});
  basis.proposalsByBranch ||= {};
  basis.proposalsByBranch[String(targetIndex)] = {
    inputSignature: b313PreviewInputSignature(sourceRow, config),
    nodeScope: pipeLedger.map(b313PreviewNodeSignature),
    nominalWallMm: proposedWall,
    selectedSchedule: 'SYNTHETIC-WIRING-TEST-ONLY',
    factorBasisMode: 'MANUAL_EXPLICIT_FALLBACK',
    manualFactorsReviewed: true,
    materialFallbackApplied: false,
    result: {selectedNominalWallMm: proposedWall},
  };
  const pullButton = host.querySelector(`[data-mc-b313-pull-row="${targetIndex}"]`);
  assert(pullButton, 'Pull icon is not mounted next to Wall Thk');
  const oldConfirm = window.confirm;
  window.confirm = () => true;
  try {
    pullButton.click();
    await waitFor(() => host.__xmlCiiPreviewResult?.branchRows?.[targetIndex]?.b313PullStatus === 'ACCEPTED',
      'Pull acceptance surviving Preview rebuild');
  } finally {
    window.confirm = oldConfirm;
  }
  const pulled = host.__xmlCiiPreviewResult;
  const pulledNodes = pulled.nodeBoreWallRows.filter((n) => Number(n.branchOccurrenceIndex) === targetIndex);
  for (const node of pipeLedger) {
    const after = pulledNodes.find((candidate) => candidate.nodeOrdinal === node.nodeOrdinal);
    assert(after && Number(after.wallThickness) === proposedWall && after.wallThicknessSource === 'b313-pulled',
      'Same-OD node wall did not propagate into effective Preview');
  }
  for (const node of branchLedger.filter((n) => !wallApplicableNode(n))) {
    const after = pulledNodes.find((candidate) => candidate.nodeOrdinal === node.nodeOrdinal);
    assert(after && String(after.wallThickness) === String(node.wallThickness),
      'Pull changed a zero-OD component wall');
  }
  assert(pulled.branchRows[targetIndex].wallThicknessSource === 'b313-pulled', 'Accepted wall source not shown in 4 Preview');
  // Real standalone parity writer must carry the accepted Preview wall into
  // enriched XML. This verifies the native-engine INPUT, not emitted CII.
  const parityDiagnostics = [];
  const nativeInput = await applyStandaloneProcessParity(xmlText, config, '', parityDiagnostics);
  assert(nativeInput.branchRows[targetIndex]?.b313PullStatus === 'ACCEPTED',
    'Standalone parity did not accept the same Step 4 Pull authority');
  const parityDoc = new DOMParser().parseFromString(nativeInput.xmlText, 'application/xml');
  const originalBranches = [...parityDoc.getElementsByTagName('*')].filter((element) => element.localName === 'Branch');
  const nativeBranch = originalBranches[targetIndex];
  assert(nativeBranch, 'Native enriched XML branch occurrence was not preserved');
  const nativeNodes = [...nativeBranch.children].filter((element) => element.localName === 'Node');
  for (const scoped of pipeLedger) {
    const nativeNode = nativeNodes[scoped.nodeOrdinal];
    assert(nativeNode, 'Accepted node ordinal missing from native enriched XML');
    const wall = [...nativeNode.children].find((element) => element.localName === 'WallThickness');
    assert(wall && Number(wall.textContent) === proposedWall,
      'Accepted Step 4 wall did not propagate to native enriched XML');
  }

  done({ ok: true, automaticWallOnBuildVerified: true,
    noAuditButtonNeededForNumericWall: true,
    editInvalidatesWallAndRebuildRestores: true,
    calculatedWallColumnVerified: true,
    assumedKpaWhatIfVisibleInColumnVerified: true,
    populatedNumericFactorsAndEvidenceVerified: true,
    screeningApprovalBlockedInBrowser: true,
    liveNumericScreeningPanelVerified: true,
    screeningUnitChangeBrowserVerified: true,
    perBranchSourceWallLedgerExportVerified: true,
    conditionalSeamlessDefaultVerified: true,
    conditionalE: 1, conditionalAlternativeRouteSwitchVerified: true,
    conditionalMasterOdReferenceVerified: true,
    syntheticPullAccepted: true, sameOdNodesUpdated: pipeLedger.length,
    zeroOdNodesProtected: branchLedger.length - pipeLedger.length,
    nativeParityFields: nativeInput.appliedFields, nativeWallNodesVerified: pipeLedger.length,
    branchCount: rows.length, a106Material: a106?.material || '',
    firstLineKey: rows[0]?.lineKey || '', firstT1: rows[0]?.t1 || '',
    autoPanelCount: host.querySelectorAll('[data-mc-b313-auto-basis-panel]').length,
    legacyVisible: Boolean(rebuiltLegacy && !rebuiltLegacy.hidden && rebuiltLegacy.style.display !== 'none'),
    blankT1Status: panel.querySelector('[data-b313-auto-status]')?.textContent || '',
    seedStatus: seedRow.querySelector('[data-b313-auto-status]')?.textContent || '',
    seedControls: seedRow.querySelectorAll('[data-b313-auto-field]').length,
    infoControls: seedRow.querySelectorAll('[data-b313-factor-info-button]').length,
    seedPanelVisible: seedPanel.getClientRects().length > 0 });
} catch (error) {
  done({ ok: false, error: error?.stack || String(error) });
}
</script>
