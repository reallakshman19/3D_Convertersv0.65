name: Step 4 B31.3 Pull acceptance (v0.65)
on:
  push:
    branches:
      - feat/step4-b313-pull-cs-mm-tolerance
  pull_request:
    branches: [main]
    paths:
      - 'converters/b313-material-factors/index.js'
      - 'converters/b313-material-factors/screening-reference.js'
      - 'docs/converters/b313-material-factors/screening-reference.js'
      - 'converters/b313-material-factors/code-factor-rule-engine.js'
      - 'converters/b313-material-factors/default-b313-code-rule-data.js'
      - 'docs/Masters/b313-code-factor-rules.json'
      - 'engineering/b313/glrd-b313-2024-external-reference-intake-v1.json'
      - 'docs/Masters/b313-material-factor-master.json'
      - 'tabs/b313-material-factors-tab.js'
      - 'scripts/generate-b313-material-factors.mjs'
      - 'scripts/generate-b313-code-factor-rules.mjs'
      - 'converters/xml-cii2019-core/b313-preview-*.js'
      - 'converters/xml-cii2019-core/branch-process-resolver.js'
      - 'converters/xml-cii2019-core/default-piping-class-material-code-rows.js'
      - 'docs/Masters/SpecwisePipingClass/93833.json'
      - 'tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-preview-*.js'
      - 'tests/xml-cii-preview-v7-observer-feedback.test.mjs'
      - 'tests/b313-material-factors.test.mjs'
      - 'tests/b313-material-factors-editor-provenance.test.mjs'
      - 'tests/glrd-b313-qualification-readiness.test.mjs'
      - 'scripts/glrd-b313-qualification-readiness.mjs'
      - 'tests/xml-cii-b313-*.test.mjs'
      - 'tests/browser/xml-cii-b313-live-preview-e2e.html'
      - 'tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-mode-a-individual-preview-tools.js'
      - 'tabs/xml-cii-2019-standalone/xml-cii-linelist-header-band.js'
      - 'tabs/xml-cii-2019-standalone/workers/master-dataset-normalize.js'
      - 'tests/xml-cii-mode-a-b313-source-wall-safety.test.mjs'
      - 'tests/xml-cii-glrd-unified-wall-review-approval.test.mjs'
      - 'tests/xml-cii-b313-glrd-16-row-linelist-coverage.test.mjs'
      - 'tests/xml-cii-issue-781-b313-*.test.mjs'
      - '.github/workflows/step4-b313-pull-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  step4-unit:
    name: Exact-head B31.3 / Preview regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Verify syntax
        run: |
          node --check converters/b313-material-factors/index.js
          node --check converters/b313-material-factors/screening-reference.js
          node --check converters/b313-material-factors/code-factor-rule-engine.js
          node --check scripts/generate-b313-code-factor-rules.mjs
          node --check scripts/generate-b313-material-factors.mjs
          node --check scripts/glrd-b313-qualification-readiness.mjs
          node --check tabs/b313-material-factors-tab.js
          node --check converters/xml-cii2019-core/b313-preview-pull-authority.js
          node --check converters/xml-cii2019-core/b313-preview-wall-update.js
          node --check tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-preview-renderer.js
          node --check tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-preview-dtxr-wall-review.js
          node --check tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-preview-bore-wall-authority.js
          node --check tabs/xml-cii-2019-standalone/xml-cii-linelist-header-band.js
          node --check tabs/xml-cii-2019-standalone/workers/master-dataset-normalize.js
          node --check tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-preview-dryrun-core.js
          node --check tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-preview-b313-wall-update.js
          node --check tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-preview-b313-auto-basis.js
          node --check tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-mode-a-individual-preview-tools.js
          node --check tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-mode-a-consolidated-easy-ui-hook.js
          node --check tabs/xml-cii-2019-standalone/ui-adapted/xml-cii-adapted-preview-facts-worker-entry.js
      - name: Check active B31.3 master generation and qualification gate
        run: |
          node scripts/generate-b313-material-factors.mjs --check
          node scripts/generate-b313-code-factor-rules.mjs --check
      - name: Test Pull, B31.3 adapters, Preview and legacy custody
        run: |
          node --test \
            tests/b313-material-factors.test.mjs \
            tests/b313-material-factors-editor-provenance.test.mjs \
            tests/glrd-b313-qualification-readiness.test.mjs \
            tests/xml-cii-b313-governed-factor-engine.test.mjs \
            tests/xml-cii-b313-glrd-config8-sourcechain.test.mjs \
            tests/xml-cii-b313-factor-qualification-intake.test.mjs \
            tests/xml-cii-b313-preview-blocker-ui-static.test.mjs \
            tests/xml-cii-b313-preview-pull-v065.test.mjs \
            tests/xml-cii-b313-preview-wall-update.test.mjs \
            tests/xml-cii-b313-preview-screening-reference.test.mjs \
            tests/xml-cii-b313-preview-visible-screening-interpolation.test.mjs \
            tests/xml-cii-b313-preview-wall-audit-controller.test.mjs \
            tests/xml-cii-b313-preview-blocker-provenance.test.mjs \
            tests/xml-cii-b313-preview-pressure-unit.test.mjs \
            tests/xml-cii-b313-common-pressure-unit-fallback.test.mjs \
            tests/xml-cii-b313-review-column-manual-rebuild.test.mjs \
            tests/xml-cii-b313-glrd-real-preview-numeric-wall-20261118.test.mjs \
            tests/xml-cii-preview-b2a-worker-rebuild.test.mjs \
            tests/xml-cii-mode-a-preview-restoration.test.mjs \
            tests/xml-cii-b313-header-band-source-unit.test.mjs \
            tests/xml-cii-b313-ui-import-pressure-unit-receipt.test.mjs \
            tests/xml-cii-b313-preview-source-pressure-class-wall.test.mjs \
            tests/xml-cii-b313-preview-od-selection.test.mjs \
            tests/xml-cii-issue-781-b313-auto-basis.test.mjs \
            tests/xml-cii-issue-781-b313-live-row-custody.test.js \
            tests/xml-cii-b313-preview-ui-static.test.js \
            tests/xml-cii-b313-glrd-16-row-linelist-coverage.test.mjs \
            tests/xml-cii-b313-unified-review-rca.test.mjs \
            tests/xml-cii-glrd-unified-wall-review-approval.test.mjs \
            tests/xml-cii-preview-v7-observer-feedback.test.mjs \
            tests/xml-cii-mode-a-b313-source-wall-safety.test.mjs
  step4-chromium:
    name: Browser Step 4 live Preview
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install browser
        run: |
          npm install --no-save --ignore-scripts playwright@1.52.0
          npx playwright install --with-deps chromium
      - name: Start local site
        run: python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/b313-step4-http.log 2>&1 &
      - name: Chromium B31.3 live Preview path
        run: node scripts/run-xml-cii-b313-live-preview-e2e.mjs
      - name: Upload site log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b313-step4-http-log
          path: /tmp/b313-step4-http.log
          if-no-files-found: warn
